name: Container
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/amd64 --build-arg SOURCE_REVISION=${{ github.sha }} --load -t pointguide:${{ github.sha }} .
      - run: test "$(docker image inspect pointguide:${{ github.sha }} --format '{{.Architecture}}')" = amd64

name: Quality
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: pointguide, POSTGRES_PASSWORD: pointguide, POSTGRES_DB: pointguide_test }
        ports: ["5432:5432"]
        options: "--health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20"
    env: { TEST_DATABASE_URL: "postgres://pointguide:pointguide@127.0.0.1:5432/pointguide_test", DATABASE_URL: "postgres://pointguide:pointguide@127.0.0.1:5432/pointguide_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run migrate
      - run: npm run check
      - run: npm run security:check
      - run: npm audit --omit=dev --audit-level=high

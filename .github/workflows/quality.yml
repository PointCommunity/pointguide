name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate repository contracts
        run: node scripts/validate-repository.mjs
      - name: Validate PointGuide skills
        run: node .agents/skills/pointguide-maintain-skills/scripts/audit-alignment.mjs
      - name: Scan source for secrets
        run: node scripts/security-check.mjs
      - name: Check dependency advisories without installation
        run: npm audit --omit=dev --audit-level=high --ignore-scripts
      - name: Check commit whitespace
        run: git -c core.hooksPath=/dev/null show --format= --check HEAD
